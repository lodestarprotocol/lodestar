<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Lodestar has moved</title>
<link rel="canonical" href="https://lodestarprotocol.xyz/"/>
<meta name="robots" content="noindex"/>
<!-- GitHub Pages cannot send a 301, so this is the strongest redirect available here: a meta
     refresh with a 0s delay, a JS replace() that does not add a history entry, and a visible
     link for anyone with JS disabled. The old app that used to live on this branch was a
     16-day-stale copy of the dapp with no chain verification and no CSP (GitHub Pages ignores
     _headers), and it would never have received the mainnet switchover. -->
<meta http-equiv="refresh" content="0; url=https://lodestarprotocol.xyz/"/>
<script>location.replace("https://lodestarprotocol.xyz/");</script>
<style>
  :root{color-scheme:light}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:#faf9f7;color:#1a1a1a;
       font:16px/1.6 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px}
  .c{max-width:30rem}
  h1{font-size:1.35rem;margin:0 0 .5rem;letter-spacing:-.01em}
  p{margin:0 0 1.25rem;color:#5c5751}
  a.btn{display:inline-block;padding:.7rem 1.4rem;border-radius:.6rem;background:#c8102e;color:#fff;
        text-decoration:none;font-weight:600}
  a.btn:hover{background:#a60d26}
</style>
</head>
<body>
  <div class="c">
    <h1>Lodestar has moved</h1>
    <p>This address is no longer maintained. The live app is at lodestarprotocol.xyz.</p>
    <p><a class="btn" href="https://lodestarprotocol.xyz/">Go to Lodestar</a></p>
  </div>
</body>
</html>
